<!DOCTYPE html>
<html>
<head>
    <title>Squircle Glassmorphic Inter 'D' Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Using a neutral background to let the logo stand out */
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        svg {
            width: 200px; /* Keep size adjustable */
            height: auto;
            overflow: visible; /* Ensure effects aren't clipped */
        }
    </style>
</head>
<body>

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glass-blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
            <feOffset in="blur" dx="1.5" dy="1.5" result="offsetBlur"/>
            <feComposite in="SourceGraphic" in2="offsetBlur" operator="in" result="shadowEffect"/>
            <feFlood flood-color="white" flood-opacity="0.4" result="floodWhite"/>
            <feComposite in="floodWhite" in2="shadowEffect" operator="in" result="innerHighlight"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="innerHighlight"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <linearGradient id="glass-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(88, 101, 242, 0.65)" /> <stop offset="100%" style="stop-color:rgba(88, 101, 242, 0.45)" />
        </linearGradient>

        </defs>

    <g filter="url(#glass-blur)">
        <path d="M 20 5 L 80 5 Q 95 5, 95 20 L 95 80 Q 95 95, 80 95 L 20 95 Q 5 95, 5 80 L 5 20 Q 5 5, 20 5 Z"
            fill="url(#glass-gradient)" /* Semi-transparent purple gradient */
            stroke="rgba(255, 255, 255, 0.35)" /* White border */
            stroke-width="1.5"
        />
    </g>

    <text
        x="50%"
        y="50%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="'Inter', sans-serif" /* Use Inter font */
        font-size="65"                     /* Adjust size as needed */
        font-weight="700"                  /* Bold weight for Inter */
        fill="#000000"                     /* Black fill color */
        dy=".05em"                         /* Optional: slight vertical adjustment for visual centering */
    >
        D
    </text>

</svg>

</body>
</html>
